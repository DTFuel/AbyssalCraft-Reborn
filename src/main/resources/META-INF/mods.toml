modLoader = "javafml"
loaderVersion = "[47,)"
license = "${license}"

[[mixins]]
config = "abyssalcraft.mixins.json"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${authors}"
description = '''
${description}
'''

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "terrablender"
mandatory = true
versionRange = "[3.0.1.10,4)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${id}]]
modId = "patchouli"
mandatory = true
versionRange = "[1.20.1-85-FORGE,)"
ordering = "AFTER"
side = "BOTH"
